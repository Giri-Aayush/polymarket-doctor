[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polymarket-doctor"
version = "0.1.0"
description = "Preflight diagnostics for Polymarket integrations"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Aayush Giri" }]
keywords = ["polymarket", "clob", "prediction-markets", "diagnostics", "market-making"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

# Kept deliberately small. This runs on a market maker's trading host, and the
# more it drags in the more likely it collides with what's already there.
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    # eth-utils leaves the keccak backend to the caller, and address checksums
    # need one. Without it is_address raises ImportError at first use.
    "eth-utils>=4.1",
    "eth-hash[pycryptodome]>=0.7",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
polymarket-doctor = "polymarket_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/Giri-Aayush/polymarket-doctor"
Issues = "https://github.com/Giri-Aayush/polymarket-doctor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/polymarket_doctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
